name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Check release version
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          $tauriVersion = (Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $cargo = Get-Content 'src-tauri/Cargo.toml' -Raw
          $cargoVersion = [regex]::Match($cargo, '(?m)^version = "([^"]+)"').Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or "v$version" -ne $env:GITHUB_REF_NAME -or $tauriVersion -ne $version -or $cargoVersion -ne $version) {
            throw 'The Git tag, package.json, tauri.conf.json and Cargo.toml versions must match.'
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:publish
      - run: pnpm check:installer
      - run: pnpm check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Test with isolated application data
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP ('msl-tests-' + [guid]::NewGuid().ToString('N'))
          foreach ($name in @('APPDATA', 'LOCALAPPDATA', 'TEMP', 'TMP')) {
            $path = Join-Path $testRoot $name
            New-Item -ItemType Directory -Path $path -Force | Out-Null
            [Environment]::SetEnvironmentVariable($name, $path, 'Process')
          }
          $env:MSL_ISOLATED_TEST = '1'
          cargo test --manifest-path src-tauri/Cargo.toml --lib --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Isolated application tests failed.' }
      - run: pnpm tauri build
      - name: Verify installed display name and upgrade safety
        shell: pwsh
        run: ./scripts/test-installer-name.ps1
      - name: Prepare stable download assets
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          $productName = (Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).productName
          $source = "src-tauri/target/release/bundle/nsis/${productName}_${version}_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $source)) { throw "Installer missing: $source" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -LiteralPath $source -Destination 'release/MSL-Desktop-Windows-x64.exe'
          $hash = (Get-FileHash -LiteralPath 'release/MSL-Desktop-Windows-x64.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $line = "$hash  MSL-Desktop-Windows-x64.exe`n"
          [System.IO.File]::WriteAllText((Join-Path $PWD 'release/SHA256SUMS.txt'), $line, [System.Text.UTF8Encoding]::new($false))
      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          $published = $false
          if ($LASTEXITCODE -eq 0) {
            $published = -not ($existing | ConvertFrom-Json).isDraft
          } else {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --verify-tag --title "MSL Desktop $tag" --generate-notes --draft
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
          }
          if (-not $published) {
            gh release upload $tag 'release/MSL-Desktop-Windows-x64.exe' 'release/SHA256SUMS.txt' --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets.' }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
            if ($LASTEXITCODE -ne 0) { throw 'Could not publish release.' }
          }
      - name: Refresh website version metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          $resource = "repos/$env:GITHUB_REPOSITORY/contents/release/latest.json"
          $record = gh api $resource | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $record.sha) { throw 'Could not read release metadata.' }
          $currentText = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($record.content -replace '\s', '')))
          $current = $currentText | ConvertFrom-Json
          if ([version]$current.version -ge [version]$version) { return }
          $json = @{ version = $version; asset = 'MSL-Desktop-Windows-x64.exe' } | ConvertTo-Json -Compress
          $content = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($json + "`n"))
          gh api --method PUT $resource -f message="Update latest Windows release to v$version" -f content=$content -f branch=master -f sha=$record.sha | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not refresh website release metadata.' }
